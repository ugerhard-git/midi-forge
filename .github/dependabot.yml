# Keeps the SHA-pinned GitHub Actions up to date with weekly pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # CI-only Python tools (zizmor), pinned by version and hash in .github/requirements-ci.txt.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
