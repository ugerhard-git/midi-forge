# Builds, checks and (for v* tags) releases MIDI Forge. See docs/ARCHITECTURE.md#build-and-ci.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# No actions/cache on purpose: this workflow builds the downloads (main's artifacts, tag releases), and a
# poisoned cache would end up in them. JUCE is fetched fresh in every job instead (about 1–2 minutes).

# Pull requests cancel their outdated runs; runs on main and tags always finish, so every commit on main
# gets a complete build (a newer push waits until the running build is done).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether anything but documentation changed. Pull requests and pushes to main that only touch
  # documentation (*.md, docs/, LICENSE) skip all other jobs. Tags (releases) and manual runs always build.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Event data is passed through env variables, never written into the script itself.
      - name: Check for changes outside the documentation
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PULL_REQUEST_BASE"
          elif [ "$EVENT" = "push" ] && [[ "$REF" == refs/heads/* ]]; then
            base="$PUSH_BEFORE"
          fi
          # Build unless there is a known base and every changed file is documentation (an empty diff builds).
          code=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames: a file moved from Source/ into docs/ then lists both paths, so it counts as code.
            changed=$(git diff --no-renames --name-only "$base" HEAD)
            echo "Changed files:"
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
              code=false
            fi
          fi
          echo "Code or build changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  engine-checks:
    name: Format, lint and engine tests
    # Skipped when only documentation changed (see the "changes" job); skipped jobs count as passed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          pip install --user clang-format==19.1.7
          sudo apt-get update -q
          sudo apt-get install -y -q clang-tidy

      - name: Check formatting
        run: ~/.local/bin/clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

      # The release workflow joins CHANGELOG.md's wrapped lines with this script; check it here, not on release day.
      - name: Check the release-notes script
        run: python3 packaging/unwrap-markdown.py --self-test

      - name: Build engine tests (warnings are errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - name: Run engine tests
        run: ctest --test-dir build --output-on-failure

      - name: Lint (clang-tidy)
        run: clang-tidy -p build --quiet --warnings-as-errors='*' Source/Engine/*.cpp Source/Engine/Modules/*.cpp Source/Engine/Modulation/*.cpp Tests/Engine/*.cpp

      - name: Run engine tests with address and undefined-behaviour sanitizers
        run: |
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_SANITIZERS=ON
          cmake --build build-sanitizers --parallel
          ctest --test-dir build-sanitizers --output-on-failure

  plugin-tests:
    name: Plug-in layer tests and editor screenshots
    # Skipped when only documentation changed (see the "changes" job); skipped jobs count as passed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN_TESTS=ON \
            -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DMIDI_FORGE_BUILD_CLAP=OFF \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          cmake --build build --target midi_forge_plugin_tests

      - name: Run tests and render the editor
        run: |
          binary=$(find build -type f -name midi_forge_plugin_tests -perm -u+x | head -n 1)
          xvfb-run -a "$binary" --snapshot-dir screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  # One job per system, each with a fixed name (no matrix): a required status check is matched by name, and a
  # job skipped by its `if` still satisfies it.
  build:
    name: Plug-in (Windows)
    # Skipped when only documentation changed (see the "changes" job); skipped jobs count as passed.
    needs: [changes, engine-checks]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      # On failure the compiler errors are also posted as annotations, so they show on the run's summary page.
      - name: Build VST3 and CLAP
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --target MidiForge_VST3 MidiForge_CLAP --parallel 4 2>&1 | tee build.log; then
            grep -E "error|fatal" build.log | sort -u | head -n 20 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/MidiForge_artefacts/Release/VST3/MIDI Forge.vst3" dist/
          cp "build/MidiForge_artefacts/Release/CLAP/MIDI Forge.clap" dist/
          cp packaging/INSTALL.txt dist/
          cp LICENSE dist/LICENSE.txt
          packaging/write-third-party-notices.sh .deps dist/THIRD-PARTY-NOTICES.txt

      # See "Validate the CLAP" in the macOS job for the version, the pin and the excluded tests.
      - name: Validate the CLAP
        shell: bash
        env:
          VALIDATOR_COMMIT: 152b9823e992d782c5c1fd33bca0295478b919aa # clap-validator 0.4.1
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install --git https://github.com/free-audio/clap-validator --rev "$VALIDATOR_COMMIT" \
            --locked --root "$RUNNER_TEMP/clap-validator"
          "$RUNNER_TEMP/clap-validator/bin/clap-validator" validate --only-failed --exclude 'state-reproducibility' \
            "dist/MIDI Forge.clap"

      # GitHub always delivers an artifact as a zip, so the folder is uploaded as it is (zipping it here
      # would give a zip inside a zip). The release job makes the release zip itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MIDI-Forge-Windows # the release job downloads it by this name
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # VST3, AU and CLAP as universal binaries (Apple Silicon and Intel). Not a required check for now: macOS
  # runners were unavailable for hours in October 2026, and a release does not wait for this job (see
  # "release-macos").
  build-macos:
    name: Plug-in (macOS)
    # Skipped when only documentation changed (see the "changes" job); skipped jobs count as passed.
    needs: [changes, engine-checks]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The steps are in .github/actions/build-macos, shared with the Intel fallback below. "./" rather than
      # GitHub's newer "$/" syntax: the job checks the repository out anyway, and actionlint does not know "$/" yet.
      - uses: ./.github/actions/build-macos # zizmor: ignore[self-repository]

  # When no Apple Silicon runner is free, GitHub cancels "Plug-in (macOS)" after about 15 minutes ("not acquired by
  # Runner"; it happened for hours in October and November 2026). This job then builds the same universal binaries
  # on an Intel runner (macos-15-intel, offered by GitHub until the macOS 15 image is retired in autumn 2027);
  # auval checks the Intel half there.
  # The condition, as tested on PR #17: a job that no runner took shows as "cancelled", but neither
  # !cancelled() nor `result == 'cancelled'` started this job, so it runs on any result but success or skipped
  # (after a real build error it gives a second opinion and fails too). always() also runs after a cancelled
  # run, and pull request runs are cancelled whenever a newer push replaces them; so the fallback serves pushes
  # to main, tags (releases) and manual runs, where the downloads come from – not pull requests.
  build-macos-intel:
    name: Plug-in (macOS, Intel fallback)
    needs: [changes, build-macos]
    if: >-
      ${{ always() && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' &&
      needs.build-macos.result != 'success' && needs.build-macos.result != 'skipped' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      # Shows in the run's summary why the fallback ran (the Apple Silicon job's result).
      - name: Why the fallback runs
        env:
          APPLE_SILICON_RESULT: ${{ needs.build-macos.result }}
        run: echo "Plug-in (macOS) ended with result '$APPLE_SILICON_RESULT'" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-macos # zizmor: ignore[self-repository] (see "Plug-in (macOS)")

  codeql:
    name: CodeQL (C++)
    # Skipped when only documentation changed (see the "changes" job); skipped jobs count as passed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the results to the repository's code scanning alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIDI_FORGE_BUILD_PLUGIN_TESTS=ON \
            -DMIDI_FORGE_BUILD_CLAP=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      # CodeQL analyses every file that is compiled while it watches the build, and its path filters do not
      # apply to C++. So everything is built once *before* CodeQL starts, then only MIDI Forge's own object
      # files (Source/, Tests/) are deleted: the build under CodeQL compiles just our code, and JUCE stays out
      # of the results.
      - name: Build everything (JUCE included) without CodeQL
        run: |
          cmake --build build --target midi_forge_engine_tests midi_forge_plugin_tests MidiForge_VST3
          find build -path '*/CMakeFiles/*' \( -path '*.dir/Source/*' -o -path '*.dir/Tests/*' \) -name '*.o' -print -delete

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build MIDI Forge's own code under CodeQL
        run: cmake --build build --target midi_forge_engine_tests midi_forge_plugin_tests MidiForge_VST3

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin-tests, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for CHANGELOG.md, the source of the release text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      # The Windows artifact is downloaded by name into its own folder. (With a pattern, a single matching
      # artifact lands directly in `path`, so the loop below would zip the plug-in bundle instead – that
      # broke the 0.22.0 release zip.) The macOS zip is added by release-macos.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MIDI-Forge-Windows
          path: artifacts/MIDI-Forge-Windows

      # Each artifact arrives as a folder (artifacts/MIDI-Forge-Windows/...); zip each one for the release.
      - name: Zip the plug-ins
        run: |
          for folder in artifacts/*/; do
            name=$(basename "$folder")
            (cd "$folder" && zip -r -q "$GITHUB_WORKSPACE/$name.zip" .)
          done
          ls -l *.zip

      # The text comes from the version's section of CHANGELOG.md ("## [0.22.0] ..." up to the next "## "), with
      # its wrapped lines joined (GitHub shows every line break of a release text). Versions below 1.0 and tags
      # with a suffix (v1.2.0-rc1) are published as pre-releases. A release that already exists for the tag (made
      # by hand on GitHub) gets the zips, and the text from CHANGELOG.md only if its own text is empty.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inSection = 1; sub(/^## \[[^]]*\] *–? */, ""); title = $0; next }
            inSection && /^## / { exit }
            inSection { print }
            END { if (title != "") print title > "release-subtitle.txt" }
          ' source/CHANGELOG.md | python3 source/packaging/unwrap-markdown.py > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          title="MIDI Forge $TAG"
          if [ -s release-subtitle.txt ]; then title="$title – $(cat release-subtitle.txt)"; fi
          prerelease=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=(--prerelease); fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --clobber
            existingText=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "${existingText//[[:space:]]/}" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --title "$title" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi

  # The macOS zip is added to the release when its build is done, so a release never waits for a macOS runner.
  # If the macOS build fails, the release keeps only the Windows zip; re-running the failed jobs adds it later.
  # The zip comes from whichever macOS job built it (Apple Silicon, or the Intel fallback). always(), because a
  # cancelled Apple Silicon job would otherwise skip this job too (see the fallback above).
  release-macos:
    name: Publish release (macOS zip)
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos-intel.result == 'success') }}
    needs: [build-macos, build-macos-intel, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MIDI-Forge-macOS
          path: artifacts/macos

      - name: Add the macOS zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" artifacts/macos/MIDI-Forge-macOS.zip --repo "$GITHUB_REPOSITORY" --clobber
