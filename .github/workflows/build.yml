# Builds, checks and (for v* tags) releases MIDI Forge. See docs/ARCHITECTURE.md#build-and-ci.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# Pull requests cancel their outdated runs; runs on main and tags always finish, so every commit on main
# gets a complete build (a newer push waits until the running build is done).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-checks:
    name: Format, lint and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          pip install --user clang-format==19.1.7
          sudo apt-get update -q
          sudo apt-get install -y -q clang-tidy

      - name: Check formatting
        run: ~/.local/bin/clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

      - name: Build engine tests (warnings are errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - name: Run engine tests
        run: ctest --test-dir build --output-on-failure

      - name: Lint (clang-tidy)
        run: clang-tidy -p build --quiet --warnings-as-errors='*' Source/Engine/*.cpp Source/Engine/Modules/*.cpp Source/Engine/Modulation/*.cpp Tests/Engine/*.cpp

      - name: Run engine tests with address and undefined-behaviour sanitizers
        run: |
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_SANITIZERS=ON
          cmake --build build-sanitizers --parallel
          ctest --test-dir build-sanitizers --output-on-failure

  plugin-tests:
    name: Plug-in layer tests and editor screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Cache dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN_TESTS=ON \
            -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          cmake --build build --target midi_forge_plugin_tests

      - name: Run tests and render the editor
        run: |
          binary=$(find build -type f -name midi_forge_plugin_tests -perm -u+x | head -n 1)
          xvfb-run -a "$binary" --snapshot-dir screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  build:
    name: Plug-in (${{ matrix.name }})
    needs: engine-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows only for now. The macOS job (universal binary, ad-hoc codesign, ditto zip) is described in
          # docs/IDEAS.md; CMake still builds a universal binary on macOS.
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      # On failure the compiler errors are also posted as annotations, so they show on the run's summary page.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --target MidiForge_VST3 --parallel 4 2>&1 | tee build.log; then
            grep -E "error|fatal" build.log | sort -u | head -n 20 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/MidiForge_artefacts/Release/VST3/MIDI Forge.vst3" dist/
          cp packaging/INSTALL.txt dist/
          cp LICENSE dist/LICENSE.txt

      # GitHub always delivers an artifact as a zip, so the folder is uploaded as it is (zipping it here
      # would give a zip inside a zip). The release job makes the release zip itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MIDI-Forge-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL (C++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the results to the repository's code scanning alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Cache dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMIDI_FORGE_BUILD_PLUGIN_TESTS=ON \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      # CodeQL analyses every file that is compiled while it watches the build, and its path filters do not
      # apply to C++. So everything is built once *before* CodeQL starts, then only MIDI Forge's own object
      # files (Source/, Tests/) are deleted: the build under CodeQL compiles just our code, and JUCE stays out
      # of the results.
      - name: Build everything (JUCE included) without CodeQL
        run: |
          cmake --build build --target midi_forge_engine_tests midi_forge_plugin_tests MidiForge_VST3
          find build -path '*/CMakeFiles/*' \( -path '*.dir/Source/*' -o -path '*.dir/Tests/*' \) -name '*.o' -print -delete

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build MIDI Forge's own code under CodeQL
        run: cmake --build build --target midi_forge_engine_tests midi_forge_plugin_tests MidiForge_VST3

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin-tests, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for CHANGELOG.md, the source of the release text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      # Each platform's artifact is downloaded by name into its own folder. (With a pattern, a single matching
      # artifact lands directly in `path`, so the loop below would zip the plug-in bundle instead – that
      # broke the 0.22.0 release zip.) A new platform gets its own step here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MIDI-Forge-Windows
          path: artifacts/MIDI-Forge-Windows

      # Each artifact arrives as a folder (artifacts/MIDI-Forge-Windows/...); zip each one for the release.
      - name: Zip the plug-ins
        run: |
          for folder in artifacts/*/; do
            name=$(basename "$folder")
            (cd "$folder" && zip -r -q "$GITHUB_WORKSPACE/$name.zip" .)
          done
          ls -l *.zip

      # The text comes from the version's section of CHANGELOG.md ("## [0.22.0] ..." up to the next "## ").
      # Versions below 1.0 and tags with a suffix (v1.2.0-rc1) are published as pre-releases. A release that
      # already exists for the tag (made by hand on GitHub) just gets the zips.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inSection = 1; sub(/^## \[[^]]*\] *–? */, ""); title = $0; next }
            inSection && /^## / { exit }
            inSection { print }
            END { if (title != "") print title > "release-subtitle.txt" }
          ' source/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          title="MIDI Forge $TAG"
          if [ -s release-subtitle.txt ]; then title="$title – $(cat release-subtitle.txt)"; fi
          prerelease=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=(--prerelease); fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --title "$title" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi
