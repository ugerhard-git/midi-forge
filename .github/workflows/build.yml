# Builds, checks and (for v* tags) releases MIDI Forge. See docs/ARCHITECTURE.md#build-and-ci.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# Pull requests cancel their outdated runs; runs on main and tags always finish, so every commit on main
# gets a complete build (a newer push waits until the running build is done).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-checks:
    name: Format, lint and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          pip install --user clang-format==19.1.7
          sudo apt-get update -q
          sudo apt-get install -y -q clang-tidy

      - name: Check formatting
        run: ~/.local/bin/clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

      - name: Build engine tests (warnings are errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - name: Run engine tests
        run: ctest --test-dir build --output-on-failure

      - name: Lint (clang-tidy)
        run: clang-tidy -p build --quiet --warnings-as-errors='*' Source/Engine/*.cpp Source/Engine/Modules/*.cpp Source/Engine/Modulation/*.cpp Tests/Engine/*.cpp

      - name: Run engine tests with address and undefined-behaviour sanitizers
        run: |
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DMIDI_FORGE_BUILD_PLUGIN=OFF -DMIDI_FORGE_SANITIZERS=ON
          cmake --build build-sanitizers --parallel
          ctest --test-dir build-sanitizers --output-on-failure

  plugin-tests:
    name: Plug-in layer tests and editor screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Cache dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_PLUGIN_TESTS=ON \
            -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          cmake --build build --target midi_forge_plugin_tests

      - name: Run tests and render the editor
        run: |
          binary=$(find build -type f -name midi_forge_plugin_tests -perm -u+x | head -n 1)
          xvfb-run -a "$binary" --snapshot-dir screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  build:
    name: Plug-in (${{ matrix.name }})
    needs: engine-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows only for now. A macOS job (macos-latest, ad-hoc codesign, ditto zip) can be added back:
          # CMake still builds a universal binary on macOS.
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDI_FORGE_BUILD_ENGINE_TESTS=OFF -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target MidiForge_VST3 --parallel 4

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/MidiForge_artefacts/Release/VST3/MIDI Forge.vst3" dist/
          cp packaging/INSTALL.txt dist/

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath MIDI-Forge-Windows.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MIDI-Forge-${{ matrix.name }}
          path: MIDI-Forge-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MIDI-Forge-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MIDI Forge $TAG" \
            --generate-notes
